<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 205" width="760" height="205" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker></defs>
<rect width="760" height="205" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#111827" text-anchor="start" font-weight="bold">How a result is stored</text>
<rect x="20" y="60" width="180" height="90" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="110" y="88" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Integer</text>
<text x="110" y="110" font-size="12" fill="#111827" text-anchor="middle">up to 2^31 - 1</text>
<text x="110" y="130" font-size="12" fill="#111827" text-anchor="middle">8 bytes per element</text>
<rect x="290" y="60" width="180" height="90" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="380" y="88" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Double</text>
<text x="380" y="110" font-size="12" fill="#111827" text-anchor="middle">whole up to 2^53</text>
<text x="380" y="130" font-size="12" fill="#111827" text-anchor="middle">16 bytes per element</text>
<rect x="560" y="60" width="180" height="90" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
<text x="650" y="88" font-size="14" fill="#111827" text-anchor="middle" font-weight="bold">Missing</text>
<text x="650" y="110" font-size="12" fill="#111827" text-anchor="middle">with a warning</text>
<text x="650" y="130" font-size="12" fill="#111827" text-anchor="middle">result is too large</text>
<line x1="202" y1="105" x2="286" y2="105" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="472" y1="105" x2="556" y2="105" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<text x="244" y="95" font-size="11" fill="#374151" text-anchor="middle">too large</text>
<text x="514" y="95" font-size="11" fill="#374151" text-anchor="middle">too large</text>
<text x="380" y="182" font-size="12" fill="#374151" text-anchor="middle">Whole vectors become double. Only the elements which are too large become missing.</text>
</svg>
