<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="760" height="215" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="ah" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#374151"/></marker></defs>
<rect width="760" height="215" fill="#ffffff"/>
<text x="20" y="28" font-size="16" fill="#111827" text-anchor="start" font-weight="bold">Adding 1/3 and 1/6</text>
<text x="110" y="70" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">1. Stored terms</text>
<rect x="50" y="88" width="120" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="50" y="130" width="120" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="110" y="111" font-size="15" fill="#111827" text-anchor="middle">1, 1</text>
<text x="110" y="153" font-size="15" fill="#111827" text-anchor="middle">3, 6</text>
<text x="110" y="192" font-size="12" fill="#374151" text-anchor="middle">n and d of each</text>
<text x="380" y="70" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">2. Exact sum</text>
<rect x="320" y="88" width="120" height="36" rx="4" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<rect x="320" y="130" width="120" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="380" y="111" font-size="15" fill="#111827" text-anchor="middle">1×6 + 1×3 = 9</text>
<text x="380" y="153" font-size="15" fill="#111827" text-anchor="middle">3×6 = 18</text>
<text x="380" y="192" font-size="12" fill="#374151" text-anchor="middle">128-bit integers</text>
<text x="650" y="70" font-size="13" fill="#111827" text-anchor="middle" font-weight="bold">3. Lowest terms</text>
<rect x="590" y="88" width="120" height="36" rx="4" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
<rect x="590" y="130" width="120" height="36" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
<text x="650" y="111" font-size="15" fill="#111827" text-anchor="middle">1</text>
<text x="650" y="153" font-size="15" fill="#111827" text-anchor="middle">2</text>
<text x="650" y="192" font-size="12" fill="#374151" text-anchor="middle">divided by gcd(9, 18) = 9</text>
<line x1="176" y1="127" x2="312" y2="127" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
<line x1="446" y1="127" x2="582" y2="127" stroke="#374151" stroke-width="1.5" marker-end="url(#ah)"/>
</svg>
